<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lakso</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="brand" src="icons/icon-48.png" width="40" height="40" alt="">
    <div>
      <h1>Appearance</h1>
      <p>Lakso</p>
    </div>
      <span class="version" id="version">0.3.0</span>
  </header>

  <main>
    <div class="row activation">
      <div><label for="enabled">Lakso</label><small>Enable the theme on X</small></div>
      <input class="switch" id="enabled" type="checkbox" role="switch">
    </div>
    <div class="row">
      <div><label for="sidebar">Right sidebar</label><small>Trends, news and suggestions. Off also widens the feed.</small></div>
      <input class="switch" id="sidebar" type="checkbox" role="switch">
    </div>
    <div class="slider-label"><label for="feedWidth">Feed width</label><output id="feedWidthValue" for="feedWidth"></output></div>
    <input id="feedWidth" type="range" min="600" max="1600" step="20" aria-description="Width of the feed column when the right sidebar is hidden">

    <fieldset id="themeFieldset">
      <legend>Theme</legend>
      <div class="swatches themes">
        <button type="button" data-theme="glass" aria-pressed="false"><i></i>Glass</button>
        <button type="button" data-theme="amber" aria-pressed="false"><i></i>Amber</button>
        <button type="button" data-theme="mono" aria-pressed="false"><i></i>Mono</button>
        <button type="button" data-theme="soft" aria-pressed="false"><i></i>Soft</button>
        <button type="button" data-theme="frame" aria-pressed="false"><i></i>Frame</button>
        <button type="button" data-theme="dim" aria-pressed="false"><i></i>Dim</button>
      </div>
    </fieldset>

    <div class="slider-label"><label for="tint">Tint intensity</label><output id="tintValue" for="tint"></output></div>
    <input id="tint" type="range" min="0" max="100" step="1" aria-description="How much color is added to the glass and background">
    <div class="slider-label"><label for="blur">Blur</label><output id="blurValue" for="blur"></output></div>
    <input id="blur" type="range" min="0" max="40" step="1">
    <div class="slider-label"><label for="opacity">Glass opacity</label><output id="opacityValue" for="opacity"></output></div>
    <input id="opacity" type="range" min="0" max="90" step="1">

    <div class="row">
      <div><label for="zebra">Alternating posts</label><small>Shade every other post</small></div>
      <input class="switch" id="zebra" type="checkbox" role="switch">
    </div>
    <div class="row">
      <div><label for="cards">Paper cards</label><small>Opaque posts with hairline rules</small></div>
      <input class="switch" id="cards" type="checkbox" role="switch">
    </div>
    <div class="row">
      <div><label for="lite">Lightweight mode</label><small>Reduce blur for better performance</small></div>
      <input class="switch" id="lite" type="checkbox" role="switch">
    </div>
    <p class="hint">Matches X’s light or dark theme. Changes apply instantly.</p>
  </main>

  <footer>
    <span id="status" role="status">Saved on this device</span>
    <button id="reset" type="button">Reset</button>
  </footer>
  <script src="settings.js"></script><script src="popup.js"></script>
</body>
</html>
